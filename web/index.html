<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="description" content="The Snake game in your browser.">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #23272e; color: #fff; overflow: hidden; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    button { font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    /* the 30 x 20 board (black, as the game draws it) is scaled to fit; the grey around it marks the walls, like the desktop window edges */
    .board { position: fixed; inset: 0; background: transparent; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
    .board canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    .overlay { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 16px; background: rgb(0 0 0 / .55); }
    .overlay.low { inset: auto 0 0 0; background: linear-gradient(transparent, rgb(0 0 0 / .65)); padding: 28px 16px 24px; }
    .overlay b { font-size: 22px; }
    .overlay small { color: #d4d8de; max-width: 420px; }
    .run { padding: 9px 22px; border: 0; border-radius: 10px; background: #2b8a3e; color: #fff; font-weight: 600; }
    .run:disabled { opacity: .5; cursor: wait; }
    .run:focus-visible { outline: 2px solid #5cd07a; outline-offset: 2px; }
    .err { position: fixed; left: 16px; right: 16px; bottom: 16px; background: #3a1d1c; border: 1px solid #ff7b72; border-radius: 10px; padding: 10px 14px; color: #ff7b72; font-family: ui-monospace, monospace; font-size: 14px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<span class="sr" id="status" role="status" aria-live="polite"></span>
<div class="board" id="board" tabindex="0" aria-label="Game board. Use the arrow keys or WASD to steer, or swipe.">
  <canvas id="game" width="750" height="500"></canvas>
  <div class="overlay" id="overlay">
    <b id="ov-title">Ready</b>
    <small id="ov-text">Press an arrow key or WASD, or tap Start. On a phone, swipe to steer.</small>
    <button type="button" class="run" id="ov-btn">Start</button>
  </div>
</div>
<div class="err" id="err" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>
